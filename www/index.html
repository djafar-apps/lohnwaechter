<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lohnwächter — Local Core</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#111827}.app{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin-top:12px}input,select,button{font:inherit;width:100%;padding:11px;margin-top:5px;box-sizing:border-box}button{margin-top:18px;font-weight:700}.error{color:#b91c1c;font-size:.9rem}.status{color:#166534;font-size:.9rem}.fatal{color:#b91c1c}.profile{border-top:1px solid #ddd;padding:12px 0}.muted{color:#6b7280;font-size:.9rem}
</style></head>
<body><main class="app">
<h1>Lohnwächter</h1><p class="muted">Local Core — Work Profile + Contract Facts</p>
<div id="storageError" class="fatal" role="alert" hidden></div>
<section class="card" aria-labelledby="formTitle"><h2 id="formTitle">Arbeitsprofil</h2>
<form id="profileForm" novalidate>
<input id="id" type="hidden">
<label for="name">Profilname</label><input id="name" maxlength="80" required aria-describedby="nameError"><div id="nameError" class="error" aria-live="polite"></div>
<label for="employer">Arbeitgeber</label><input id="employer" maxlength="120" required aria-describedby="employerError"><div id="employerError" class="error" aria-live="polite"></div>
<label for="employmentType">Beschäftigungsart</label><select id="employmentType" required aria-describedby="employmentTypeError"><option value="">Bitte wählen</option><option value="full_time">Vollzeit</option><option value="part_time">Teilzeit</option><option value="mini_job">Minijob</option><option value="other">Andere</option></select><div id="employmentTypeError" class="error" aria-live="polite"></div>
<label for="weeklyHours">Wochenstunden</label><input id="weeklyHours" type="number" min="0" max="168" step="0.01" required aria-describedby="weeklyHoursError"><div id="weeklyHoursError" class="error" aria-live="polite"></div>
<label for="annualLeaveDays">Urlaubstage/Jahr</label><input id="annualLeaveDays" type="number" min="0" max="366" step="0.01" required aria-describedby="annualLeaveDaysError"><div id="annualLeaveDaysError" class="error" aria-live="polite"></div>
<label for="grossHourlyRate">Bruttostundenlohn (€) — optional</label><input id="grossHourlyRate" type="number" min="0" max="10000" step="0.01" aria-describedby="grossHourlyRateError"><div id="grossHourlyRateError" class="error" aria-live="polite"></div>
<button type="submit">Speichern</button><p id="saveStatus" class="status" role="status" aria-live="polite"></p>
</form></section>
<section class="card"><h2>Gespeicherte Profile</h2><div id="profiles"></div></section>
</main>
<script src="local-core.js"></script><script>
(()=>{'use strict';const repo=LohnCore.repo(localStorage),form=document.getElementById('profileForm'),fields=['name','employer','employmentType','weeklyHours','annualLeaveDays','grossHourlyRate'];
const el=id=>document.getElementById(id);function fatal(msg){el('storageError').hidden=false;el('storageError').textContent=msg;form.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function render(){const loaded=repo.load();if(!loaded.ok){fatal('Lokale Daten konnten nicht sicher gelesen werden. Nichts wurde überschrieben.');return}el('profiles').replaceChildren(...loaded.value.profiles.map(p=>{const d=document.createElement('div');d.className='profile';const b=document.createElement('button');b.type='button';b.textContent=p.name+' — '+p.employer+' · Vom Nutzer bestätigt';b.addEventListener('click',()=>edit(p));d.appendChild(b);return d}),...(loaded.value.profiles.length?[]:[document.createTextNode('Noch keine Profile.')]))}
function edit(p){el('id').value=p.id;el('name').value=p.name;el('employer').value=p.employer;el('employmentType').value=p.employmentType;el('weeklyHours').value=p.contract.weeklyHours;el('annualLeaveDays').value=p.contract.annualLeaveDays;el('grossHourlyRate').value=p.contract.grossHourlyRate??'';el('name').focus()}
form.addEventListener('submit',e=>{e.preventDefault();fields.forEach(f=>el(f+'Error').textContent='');el('saveStatus').textContent='';const profile={id:el('id').value,name:el('name').value,employer:el('employer').value,employmentType:el('employmentType').value},contract={weeklyHours:el('weeklyHours').value,annualLeaveDays:el('annualLeaveDays').value,grossHourlyRate:el('grossHourlyRate').value},r=repo.saveProfile(profile,contract);if(!r.ok){if(r.errors){for(const [k] of Object.entries(r.errors)){el(k+'Error').textContent='Bitte gültig ausfüllen.'}const first=fields.find(f=>r.errors[f]);if(first)el(first).focus()}else fatal('Lokale Daten konnten nicht sicher verarbeitet werden. Nichts wurde überschrieben.');return}el('id').value=r.value.id;el('saveStatus').textContent='Gespeichert · Vom Nutzer bestätigt';render()});render()})();
</script></body></html>
